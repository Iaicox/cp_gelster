<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Форма КП - SolidJS</title>
  <link rel="stylesheet" href="../style/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../style/style.css">
  <script src="../style/jquery/jquery-3.3.1.min.js"></script>
  <script src="../localStorageDB.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { createSignal, createEffect, For } from "./lib/solid.js";
    import { render } from "./lib/web.js";

    function RequestForm() {
      const [client, setClient] = createSignal(localStorage.getItem('client') || '');
      const [clientName, setClientName] = createSignal(localStorage.getItem('clientName') || '');
      const [clientSex, setClientSex] = createSignal(localStorage.getItem('clientSex') || 'm');
      const [linkToItems, setLinkToItems] = createSignal(localStorage.getItem('linkToItems') || '');
      const [euroRate, setEuroRate] = createSignal(localStorage.getItem('euroRate') || '');
      const [materials, setMaterials] = createSignal(JSON.parse(localStorage.getItem('materials') || '[]'));

      createEffect(() => localStorage.setItem('client', client()));
      createEffect(() => localStorage.setItem('clientName', clientName()));
      createEffect(() => localStorage.setItem('clientSex', clientSex()));
      createEffect(() => localStorage.setItem('linkToItems', linkToItems()));
      createEffect(() => localStorage.setItem('euroRate', euroRate()));
      createEffect(() => localStorage.setItem('materials', JSON.stringify(materials())));

      const addMaterial = () => setMaterials([...materials(), {name:'', qty:'', unit:'шт.', price:''}]);
      const updateMaterial = (index, key, value) => {
        const list = [...materials()];
        list[index][key] = value;
        setMaterials(list);
      };
      const removeMaterial = index => {
        const list = [...materials()];
        list.splice(index, 1);
        setMaterials(list);
      };
      const submitForm = (e) => {
        e.preventDefault();
        window.location.href = 'result-solid.html';
      };

      return (
        <form onSubmit={submitForm} class="p-3">
          <h1>Заполни форму:</h1>
          <div class="mb-3">
            <label>Название компании:
              <input type="text" value={client()} onInput={e => setClient(e.currentTarget.value)} class="form-control" />
            </label>
          </div>
          <div class="mb-3">
            <label>Имя контактного лица:
              <input type="text" value={clientName()} onInput={e => setClientName(e.currentTarget.value)} class="form-control" />
            </label>
          </div>
          <div class="mb-3">
            <label class="me-3">Пол контактного лица:</label>
            <label class="me-2"><input type="radio" checked={clientSex() === 'm'} value="m" name="sex" onInput={() => setClientSex('m')} /> Муж.</label>
            <label><input type="radio" checked={clientSex() === 'f'} value="f" name="sex" onInput={() => setClientSex('f')} /> Жен.</label>
          </div>
          <div class="mb-3">
            <label>Ссылка на коллекцию:
              <input type="url" value={linkToItems()} onInput={e => setLinkToItems(e.currentTarget.value)} class="form-control" />
            </label>
          </div>
          <div class="mb-3">
            <label>Введите текущий курс евро:
              <input type="text" value={euroRate()} onInput={e => setEuroRate(e.currentTarget.value)} class="form-control" />
            </label>
          </div>
          <fieldset class="mb-3">
            <legend>Основные материалы:</legend>
            <For each={materials()}>{(mat, i) => (
              <div class="row g-2 align-items-end mb-2">
                <div class="col"><input class="form-control" placeholder="Наименование" value={mat.name} onInput={e => updateMaterial(i(), 'name', e.currentTarget.value)} /></div>
                <div class="col-2"><input class="form-control" placeholder="Кол-во" value={mat.qty} onInput={e => updateMaterial(i(), 'qty', e.currentTarget.value)} /></div>
                <div class="col-2">
                  <select class="form-select" value={mat.unit} onInput={e => updateMaterial(i(), 'unit', e.currentTarget.value)}>
                    <option value="шт.">шт.</option>
                    <option value="м²">м²</option>
                    <option value="пог.м">пог.м</option>
                  </select>
                </div>
                <div class="col-2"><input class="form-control" placeholder="Цена" value={mat.price} onInput={e => updateMaterial(i(), 'price', e.currentTarget.value)} /></div>
                <div class="col-auto"><button type="button" class="btn btn-danger" onClick={() => removeMaterial(i())}>×</button></div>
              </div>
            )}</For>
            <button type="button" class="btn btn-secondary mt-2" onClick={addMaterial}>Добавить материал</button>
          </fieldset>
          <button type="submit" class="btn btn-primary">Сгенерировать КП</button>
        </form>
      );
    }

    render(RequestForm, document.getElementById('app'));
  </script>
</body>
</html>
